  --paper:#fff; --soft:#f3f5f9; --blue:#2148ef; --blue-dark:#1537c7;

  color-scheme:light;
}

:root[lang="ka"]{--f:'Noto Sans Georgian','Inter',system-ui,sans-serif}
:root[lang="hi"]{--f:'Noto Sans Devanagari','Inter',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.page{min-height:100%;display:grid;place-items:center;padding:40px 24px}
.box{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;max-width:52ch}
.code{font-size:13px;font-weight:700;letter-spacing:2px;color:var(--muted);display:flex;align-items:center;gap:11px}
.code::before{content:"";width:18px;height:3px;border-radius:2px;background:var(--orange)}
h1{margin:0;font-size:clamp(26px,4.4vw,40px);line-height:1.15;letter-spacing:-1.4px;font-weight:800;text-wrap:balance}
p{margin:0;color:var(--muted);font-size:17px}
.btn{display:inline-flex;align-items:center;gap:9px;margin-top:6px;font-size:16px;font-weight:600;padding:15px 24px;border-radius:9px;background:var(--blue);color:#fff;text-decoration:none;transition:background .15s ease}
.btn:hover{background:var(--blue-dark)}
.btn:focus-visible{outline:2px solid var(--orange);outline-offset:3px}

/* грустный робот: рот перевёрнут, волны обвисли */
.sad{width:170px;height:92px;display:block}
.sad svg{width:100%;height:100%;overflow:visible}
.face{fill:var(--blue)}
.eye{fill:#fff}
.mouth{fill:#fff;transform-box:fill-box;transform-origin:50% 50%;animation:sigh 3.4s ease-in-out infinite}
.tear{fill:#8fa6ff;opacity:0;animation:drip 3.4s ease-in-out infinite}
.wave{fill:none;stroke:var(--line);stroke-width:2.2;stroke-linecap:round}
@keyframes sigh{0%,100%{transform:translateY(0)}50%{transform:translateY(1.2px)}}
@keyframes drip{0%,55%{opacity:0;transform:translateY(0)}65%{opacity:.9}100%{opacity:0;transform:translateY(9px)}}
@media (prefers-reduced-motion:reduce){.mouth,.tear{animation:none}.tear{opacity:.8}}
</style>

<script>

    for (var i = 0; i < list.length; i++) {
